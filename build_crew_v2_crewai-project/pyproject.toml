[project]
name = "build_crew"
version = "0.1.0"
description = "build_crew using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[file-processing,litellm,tools]>=1.15.5,<2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/build_crew"]

[tool.crewai]
type = "flow"
definition = "src/build_crew/flow.json"

[tool.uv]
override-dependencies = ["litellm<=1.82.6"]
