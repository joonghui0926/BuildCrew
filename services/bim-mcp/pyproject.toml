[project]
name = "buildcrew-bim-mcp"
version = "0.1.0"
description = "Source-traceable BIM generation and coordination MCP for BuildCrew"
requires-python = ">=3.11,<3.14"
dependencies = [
  "httpx>=0.28,<1",
  "mcp>=1.27,<2",
  "numpy>=2.1,<3",
  "pydantic>=2.11,<3",
  "trimesh>=4.7,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
]

[project.scripts]
buildcrew-bim-mcp = "buildcrew_bim_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/buildcrew_bim_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
